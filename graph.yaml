# =============================================================================
# LeLitParfait.fr — graphe sémantique (seed v0.1, 10/09/2026)
# 1 nœud = 1 entité ou 1 intention de recherche = 1 URL.
# Le site est la projection HTML de ce fichier : pages, fil d'Ariane,
# blocs "à lire aussi", JSON-LD @graph et sitemap sont générés depuis ici.
#
# type      : home | hub | spoke | comparatif | produit | glossaire
# intent    : info | commercial | transactionnel
# status    : published (URL existante à migrer) | planned
# parent    : arête hiérarchique (isPartOf / breadcrumb / 1 lien montant obligatoire)
# related   : arêtes latérales avec ancre imposée (entité + attribut, jamais "cliquez ici")
# sameAs    : ancrage de l'entité (Wikipédia FR / Wikidata) — URLs à vérifier avant mise en prod
# redirect_from : ancienne URL → page de redirection meta refresh 0s + canonical (GitHub Pages ne fait pas de 301)
# =============================================================================

site:
  url: https://lelitparfait.fr
  publisher: { id: "#organization", name: "LeLitParfait.fr" }
  author:    { id: "#author", type: Person, name: "Angélina Saglietti", url: "https://lelitparfait.fr/a-propos/" }
  entity_centrale: matelas
  regles_maillage:
    liens_montants: 1          # vers le parent
    liens_lateraux: [2, 4]     # même cluster
    liens_transverses: 1       # cluster adjacent
    profondeur_max: 3          # clics depuis /
    ancre: "entité + attribut" # ex. "matelas à mémoire de forme pour le mal de dos"

nodes:
